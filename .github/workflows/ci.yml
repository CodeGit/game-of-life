name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.script }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        script: [lint, format:check, typecheck, test, build]
    defaults:
      run:
        working-directory: web
    env:
      LEFTHOOK: '0'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: web/pnpm-lock.yaml 
      - run: pnpm install --frozen-lockfile
      - run: pnpm run ${{ matrix.script }}
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      LEFTHOOK: '0'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Run the tests with coverage
        run: |
          set -o pipefail
          pnpm run test:coverage | tee coverage-output.txt
      - name: Show the coverage table on the run page
        if: always()
        run: |
          {
            echo '```'
            cat coverage-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: web/coverage/
          retention-days: 14

