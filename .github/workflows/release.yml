name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: web
          file: web/Container/Containerfile
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/codegit/game-of-life:latest
            ghcr.io/codegit/game-of-life:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/CodeGit/game-of-life
